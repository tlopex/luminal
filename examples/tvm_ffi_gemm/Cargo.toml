[package]
name = "tvm-ffi-gemm-demo"
version = "0.1.0"
edition = "2024"
publish = false

# This first prototype deliberately builds independently of Luminal's runtimes.
[workspace]

[dependencies]
anyhow = "1"
cudarc = { git = "https://github.com/luminal-ai/cudarc.git", rev = "a42f3897b6d00aded8e6ac7ad258c72d8bad5596", default-features = false, features = ["std", "driver", "cublas", "dynamic-loading", "cuda-version-from-build-system", "fallback-latest"] }
# Match apache-tvm-ffi==0.1.12; do not depend on a developer's local checkout.
tvm-ffi = { git = "https://github.com/apache/tvm-ffi.git", rev = "3050b0a7bd48e04f853027c5fa1f5ab7bc20b856" }
